# Pacote .rpm do Orkest. NÃO buildável neste Mac — gerado no CI (ubuntu-24.04
# com `apt install rpm` → rpmbuild; arch detectada por uname -m). Valida-se em
# container fedora:40 (premissa do plano).
#
# Artefato resultante: orkest-code-<versão>.<arch>.rpm
display_name: Orkest Code
summary: Orkest Code — development environment for AI teams
license: MIT
url: https://github.com/flavioacv/remote_pi
vendor: Flavio ACV
packager: Flavio ACV
packagerEmail: flavioacv.soft@gmail.com
group: Development/Tools
generic_name: Orkest Code
# Deps de runtime: GTK3 (nome do pacote no Fedora).
requires:
  - gtk3
  # Plano 46 — preview de A/V via media_kit (libmpv) usando a lib do sistema.
  - mpv-libs
  # Plano 51 — flutter_secure_storage (senha de banco) usa o Secret Service.
  - libsecret
categories:
  - Development
  - IDE
keywords:
  - pi
  - remote-pi
  - agent
  - orkest
startup_notify: true
icon: linux/runner/resources/app_icon_512.png
metainfo: linux/com.flavioacv.orkestcode.metainfo.xml
description: |
  Orkest Code é um ambiente de desenvolvimento com terminais e agentes de IA. Baseado no motor do
  Pi. Roda agentes (cada um um `pi --mode rpc`) e terminais lado a lado, com
  árvore de arquivos, worktrees por workspace e agendamento de daemons.
