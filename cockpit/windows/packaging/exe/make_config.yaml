# Instalador Windows (Inno Setup) do Orkest. NÃO buildável neste Mac — gerado
# no job `windows` do CI (windows-latest + Inno Setup). Code signing via
# SignPath OSS acontece no workflow, em duas etapas (exes internos antes de
# empacotar, instalador depois): ver orkest-release.yml.
app_id: com.flavioacv.orkestcode
display_name: Orkest Code
publisher_name: Flavio ACV
publisher_url: https://github.com/flavioacv/remote_pi
# O binário do runner Windows é `orkest.exe` (BINARY_NAME=orkest).
executable_name: orkest.exe
# Instala por usuário (sem exigir admin) em %LOCALAPPDATA%\Programs.
install_dir_name: "{userpf}\\Orkest Code"
privileges_required: lowest
create_desktop_icon: true
setup_icon_file: windows/runner/resources/app_icon.ico
locales:
  - en
